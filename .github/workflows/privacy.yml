name: Privacy audit, tests and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Audit source
        run: scripts/privacy-audit.sh

      - name: Live sandbox test
        run: scripts/sandbox-probe.sh

      - name: Run tests
        run: |
          xcodebuild build-for-testing -project Forecast.xcodeproj -scheme Forecast \
            -destination 'platform=macOS' -derivedDataPath build
          xcrun xctest build/Build/Products/Debug/ForecastTests.xctest

      - name: Build Release
        run: |
          xcodebuild build -project Forecast.xcodeproj -scheme Forecast -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build

      - name: Audit built app
        run: scripts/privacy-audit.sh build/Build/Products/Release/Forecast.app
